<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Contact</title>
    <link rel="stylesheet" href="1.css">
</head>

<body>
<div id="notificationBanner" class="notification-banner">
    <span>Welcome to StudentHub! Stay tuned for upcoming events and announcements.</span>
    <button id="closeBanner" class="close-banner" aria-label="Close notification">&times;</button>
</div>


<header>
    <h1>Contact StudentHub</h1>

    <nav>
    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        ☰
    </button>
    <ul class="nav-list" id="navMenu">
           
            <li><a href="about.html">About</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="faq.html">FAQ</a></li>
        </ul>
    </nav>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
    Dark Mode
</button>
</header>

<main>

<section>
    <h2>Contact Us</h2>

    <form>

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
