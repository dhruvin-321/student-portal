<!DOCTYPE html>

    <link rel="stylesheet" href="1.css">
</head>

<body>
<div id="notificationBanner" class="notification-banner">
    <span>Welcome to StudentHub! Stay tuned for upcoming events and announcements.</span>
    <button id="closeBanner" class="close-banner" aria-label="Close notification">&times;</button>
</div>


<header>
    <h1>StudentHub</h1>

    <nav>
    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        ☰
    </button>
    <ul class="nav-list" id="navMenu">
            <li><a href="about.html">About</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>

        </ul>
    </nav>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
    Dark Mode
</button>
</header>

<main>

<section>
    <h2>Student Registration</h2>

    <form>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="student-id" required>

        <label for="course">Course</label>
        <select id="course" name="course">
            <option value="">Select Course</option>
            <option value="cse">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ece">Electronics</option>
        </select>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Register</button>

    </form>

</section>

</main>

</body>
</html>
